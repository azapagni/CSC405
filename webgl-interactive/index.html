<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Cube Viewer</title>
    <style>
        body {
            margin: 20px;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        h1 {
            text-align: center;
        }
        canvas {
            border: 2px solid black;
            display: block;
            margin: 20px auto;
            background: white;
        }
        .controls {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .control {
            margin: 15px 0;
        }
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 300px;
        }
        .button-group {
            margin: 20px 0;
            padding: 15px;
            background: #e8e8e8;
            border-radius: 5px;
        }
        .button-group h3 {
            margin-top: 0;
        }
        button {
            margin: 5px;
            padding: 10px 15px;
            cursor: pointer;
            border: 2px solid #333;
            background: white;
            border-radius: 5px;
            font-size: 14px;
        }
        button.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        button:hover {
            background: #ddd;
        }
        button.active:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <h1>Advanced Cube Viewer</h1>
    <canvas id="glCanvas" width="600" height="600"></canvas>
    
    <div class="controls">
        <div class="button-group">
            <h3>Shader Mode</h3>
            <button id="solidBtn" class="active" onclick="setShaderMode('solid')">Solid Colors</button>
            <button id="gradientBtn" onclick="setShaderMode('gradient')">Gradient</button>
            <button id="stripesBtn" onclick="setShaderMode('stripes')">Stripes</button>
            <button id="checkerBtn" onclick="setShaderMode('checker')">Checkerboard</button>
        </div>

        <div class="button-group">
            <h3>Projection Type</h3>
            <button id="orthoBtn" class="active" onclick="setProjection('ortho')">Orthographic</button>
            <button id="perspBtn" onclick="setProjection('perspective')">Perspective</button>
        </div>

        <div class="button-group">
            <h3>Visualization</h3>
            <button id="wireframeBtn" onclick="toggleWireframe()">Toggle Wireframe</button>
            <button id="rotateBtn" class="active" onclick="toggleAutoRotate()">Auto-Rotate</button>
        </div>
        
        <div class="control">
            <label>Radius: <span id="radiusValue">3.0</span></label>
            <input id="radiusSlider" type="range" min="1" max="10" step="0.1" value="3">
        </div>
        
        <div class="control">
            <label>Theta: <span id="thetaValue">0.79</span></label>
            <input id="thetaSlider" type="range" min="0" max="3.14" step="0.01" value="0.79">
        </div>
        
        <div class="control">
            <label>Phi: <span id="phiValue">0.79</span></label>
            <input id="phiSlider" type="range" min="0" max="6.28" step="0.01" value="0.79">
        </div>
        
        <div class="control">
            <label>Depth: <span id="depthValue">2.0</span></label>
            <input id="depthSlider" type="range" min="0.5" max="6" step="0.1" value="2">
        </div>
    </div>

    <script>
        // Helper functions
        function vec3(x, y, z) {
            return [x, y, z];
        }

        function subtract(u, v) {
            return [u[0] - v[0], u[1] - v[1], u[2] - v[2]];
        }

        function normalize(v) {
            const len = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
            return [v[0] / len, v[1] / len, v[2] / len];
        }

        function cross(u, v) {
            return [
                u[1] * v[2] - u[2] * v[1],
                u[2] * v[0] - u[0] * v[2],
                u[0] * v[1] - u[1] * v[0]
            ];
        }

        function flatten(arr) {
            return new Float32Array([].concat(...arr));
        }

        function lookAt(eye, at, up) {
            const n = normalize(subtract(eye, at));
            const u = normalize(cross(up, n));
            const v = normalize(cross(n, u));
            
            return [
                u[0], v[0], n[0], 0,
                u[1], v[1], n[1], 0,
                u[2], v[2], n[2], 0,
                -u[0] * eye[0] - u[1] * eye[1] - u[2] * eye[2],
                -v[0] * eye[0] - v[1] * eye[1] - v[2] * eye[2],
                -n[0] * eye[0] - n[1] * eye[1] - n[2] * eye[2],
                1
            ];
        }

        function ortho(left, right, bottom, top, near, far) {
            return [
                2 / (right - left), 0, 0, 0,
                0, 2 / (top - bottom), 0, 0,
                0, 0, -2 / (far - near), 0,
                -(right + left) / (right - left),
                -(top + bottom) / (top - bottom),
                -(far + near) / (far - near),
                1
            ];
        }

        function perspective(fov, aspect, near, far) {
            const f = 1.0 / Math.tan(fov / 2);
            const nf = 1 / (near - far);
            
            return [
                f / aspect, 0, 0, 0,
                0, f, 0, 0,
                0, 0, (far + near) * nf, -1,
                0, 0, (2 * far * near) * nf, 0
            ];
        }

        // Setup WebGL
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl2');

        if (!gl) {
            alert('WebGL 2 not supported');
        }

        // Multiple Fragment Shaders
        const fragmentShaders = {
            solid: `#version 300 es
                precision mediump float;
                in vec4 vColor;
                out vec4 fColor;
                
                void main() {
                    fColor = vColor;
                }
            `,
            gradient: `#version 300 es
                precision mediump float;
                in vec4 vColor;
                in vec3 vPosition;
                out vec4 fColor;
                
                void main() {
                    float gradient = (vPosition.y + 0.5);
                    fColor = vec4(vColor.rgb * gradient, 1.0);
                }
            `,
            stripes: `#version 300 es
                precision mediump float;
                in vec4 vColor;
                in vec3 vPosition;
                out vec4 fColor;
                
                void main() {
                    float stripe = mod(floor(vPosition.y * 10.0), 2.0);
                    fColor = vec4(vColor.rgb * (0.5 + stripe * 0.5), 1.0);
                }
            `,
            checker: `#version 300 es
                precision mediump float;
                in vec4 vColor;
                in vec3 vPosition;
                out vec4 fColor;
                
                void main() {
                    float checker = mod(floor(vPosition.x * 5.0) + floor(vPosition.y * 5.0) + floor(vPosition.z * 5.0), 2.0);
                    fColor = vec4(vColor.rgb * (0.5 + checker * 0.5), 1.0);
                }
            `
        };

        // Vertex Shader
        const vertexShaderSource = `#version 300 es
            in vec4 aPosition;
            in vec4 aColor;
            out vec4 vColor;
            out vec3 vPosition;
            uniform mat4 uModelViewMatrix;
            uniform mat4 uProjectionMatrix;
            
            void main() {
                vColor = aColor;
                vPosition = aPosition.xyz;
                gl_Position = uProjectionMatrix * uModelViewMatrix * aPosition;
            }
        `;

        // Compile shader
        function compileShader(source, type) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader error:', gl.getShaderInfoLog(shader));
            }
            return shader;
        }

        // Create program with specific fragment shader
        let currentProgram;
        let currentShaderMode = 'solid';
        let currentProjection = 'ortho';
        let wireframeMode = false;
        let autoRotate = true;

        function createProgram(fragmentShaderSource) {
            const vertexShader = compileShader(vertexShaderSource, gl.VERTEX_SHADER);
            const fragmentShader = compileShader(fragmentShaderSource, gl.FRAGMENT_SHADER);
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('Program error:', gl.getProgramInfoLog(program));
            }
            
            return program;
        }

        currentProgram = createProgram(fragmentShaders.solid);
        gl.useProgram(currentProgram);

        // Cube data
        const positions = [
            // Front face
            -0.5, -0.5,  0.5,  0.5, -0.5,  0.5,  0.5,  0.5,  0.5,
            -0.5, -0.5,  0.5,  0.5,  0.5,  0.5, -0.5,  0.5,  0.5,
            // Back face
            -0.5, -0.5, -0.5, -0.5,  0.5, -0.5,  0.5,  0.5, -0.5,
            -0.5, -0.5, -0.5,  0.5,  0.5, -0.5,  0.5, -0.5, -0.5,
            // Top face
            -0.5,  0.5, -0.5, -0.5,  0.5,  0.5,  0.5,  0.5,  0.5,
            -0.5,  0.5, -0.5,  0.5,  0.5,  0.5,  0.5,  0.5, -0.5,
            // Bottom face
            -0.5, -0.5, -0.5,  0.5, -0.5, -0.5,  0.5, -0.5,  0.5,
            -0.5, -0.5, -0.5,  0.5, -0.5,  0.5, -0.5, -0.5,  0.5,
            // Right face
             0.5, -0.5, -0.5,  0.5,  0.5, -0.5,  0.5,  0.5,  0.5,
             0.5, -0.5, -0.5,  0.5,  0.5,  0.5,  0.5, -0.5,  0.5,
            // Left face
            -0.5, -0.5, -0.5, -0.5, -0.5,  0.5, -0.5,  0.5,  0.5,
            -0.5, -0.5, -0.5, -0.5,  0.5,  0.5, -0.5,  0.5, -0.5
        ];

        const colors = [];
        const faceColors = [
            [1, 0, 0, 1], // Red
            [0, 1, 0, 1], // Green
            [0, 0, 1, 1], // Blue
            [1, 1, 0, 1], // Yellow
            [1, 0, 1, 1], // Magenta
            [0, 1, 1, 1]  // Cyan
        ];
        
        for (let face of faceColors) {
            for (let i = 0; i < 6; i++) {
                colors.push(...face);
            }
        }

        const numPositions = positions.length / 3;

        // Buffers
        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);

        const colorBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);

        function setupAttributes() {
            const aPositionLoc = gl.getAttribLocation(currentProgram, 'aPosition');
            const aColorLoc = gl.getAttribLocation(currentProgram, 'aColor');

            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.vertexAttribPointer(aPositionLoc, 3, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(aPositionLoc);

            gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
            gl.vertexAttribPointer(aColorLoc, 4, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(aColorLoc);
        }

        setupAttributes();

        gl.enable(gl.DEPTH_TEST);
        gl.clearColor(0.95, 0.95, 0.95, 1.0);

        // Fixed values
        const at = vec3(0.0, 0.0, 0.0);
        const up = vec3(0.0, 1.0, 0.0);

        // Variables
        let radius = 3.0;
        let theta = 0.79;
        let phi = 0.79;
        let near = -1.0;
        let far = 1.0;
        let left = -1.0;
        let right = 1.0;
        let bottom = -1.0;
        let ytop = 1.0;

        // Event handlers
        document.getElementById('radiusSlider').oninput = function(e) {
            radius = parseFloat(e.target.value);
            document.getElementById('radiusValue').textContent = radius.toFixed(1);
        };

        document.getElementById('thetaSlider').oninput = function(e) {
            theta = parseFloat(e.target.value);
            document.getElementById('thetaValue').textContent = theta.toFixed(2);
        };

        document.getElementById('phiSlider').oninput = function(e) {
            phi = parseFloat(e.target.value);
            document.getElementById('phiValue').textContent = phi.toFixed(2);
        };

        document.getElementById('depthSlider').oninput = function(e) {
            const depth = parseFloat(e.target.value);
            far = depth / 2;
            near = -depth / 2;
            document.getElementById('depthValue').textContent = depth.toFixed(1);
        };

        function setShaderMode(mode) {
            currentShaderMode = mode;
            currentProgram = createProgram(fragmentShaders[mode]);
            gl.useProgram(currentProgram);
            setupAttributes();
            
            // Update button states
            document.getElementById('solidBtn').classList.remove('active');
            document.getElementById('gradientBtn').classList.remove('active');
            document.getElementById('stripesBtn').classList.remove('active');
            document.getElementById('checkerBtn').classList.remove('active');
            document.getElementById(mode + 'Btn').classList.add('active');
        }

        function setProjection(type) {
            currentProjection = type;
            
            // Update button states
            document.getElementById('orthoBtn').classList.remove('active');
            document.getElementById('perspBtn').classList.remove('active');
            document.getElementById(type === 'ortho' ? 'orthoBtn' : 'perspBtn').classList.add('active');
        }

        function toggleWireframe() {
            wireframeMode = !wireframeMode;
            document.getElementById('wireframeBtn').classList.toggle('active');
        }

        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            document.getElementById('rotateBtn').classList.toggle('active');
        }

        // Render loop
        function render() {
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            
            // Auto-rotate
            if (autoRotate) {
                phi += 0.01;
                document.getElementById('phiValue').textContent = phi.toFixed(2);
                document.getElementById('phiSlider').value = phi;
            }
            
            const eye = vec3(
                radius * Math.sin(theta) * Math.cos(phi),
                radius * Math.sin(theta) * Math.sin(phi),
                radius * Math.cos(theta)
            );
            
            const modelViewMatrix = lookAt(eye, at, up);
            
            let projectionMatrix;
            if (currentProjection === 'ortho') {
                projectionMatrix = ortho(left, right, bottom, ytop, near, far);
            } else {
                projectionMatrix = perspective(45 * Math.PI / 180, 1.0, 0.1, 100.0);
            }
            
            const modelViewMatrixLoc = gl.getUniformLocation(currentProgram, 'uModelViewMatrix');
            const projectionMatrixLoc = gl.getUniformLocation(currentProgram, 'uProjectionMatrix');
            
            gl.uniformMatrix4fv(modelViewMatrixLoc, false, flatten(modelViewMatrix));
            gl.uniformMatrix4fv(projectionMatrixLoc, false, flatten(projectionMatrix));
            
            // Draw solid or wireframe
            if (wireframeMode) {
                for (let i = 0; i < numPositions; i += 3) {
                    gl.drawArrays(gl.LINE_LOOP, i, 3);
                }
            } else {
                gl.drawArrays(gl.TRIANGLES, 0, numPositions);
            }
            
            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
