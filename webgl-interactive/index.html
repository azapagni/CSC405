<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Cube Viewer</title>
    <style>
        body {
            margin: 20px;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid black;
            display: block;
            margin: 20px auto;
        }
        .controls {
            max-width: 600px;
            margin: 0 auto;
        }
        .control {
            margin: 10px 0;
        }
        label {
            display: inline-block;
            width: 150px;
        }
    </style>
</head>
<body>
    <canvas id="glCanvas" width="600" height="600"></canvas>
    
    <div class="controls">
        <div class="control">
            <label>Radius: <span id="radiusValue">3.0</span></label>
            <input id="radiusSlider" type="range" min="1" max="10" step="0.1" value="3">
        </div>
        
        <div class="control">
            <label>Theta: <span id="thetaValue">0.79</span></label>
            <input id="thetaSlider" type="range" min="0" max="3.14" step="0.01" value="0.79">
        </div>
        
        <div class="control">
            <label>Phi: <span id="phiValue">0.79</span></label>
            <input id="phiSlider" type="range" min="0" max="6.28" step="0.01" value="0.79">
        </div>
        
        <div class="control">
            <label>Depth: <span id="depthValue">2.0</span></label>
            <input id="depthSlider" type="range" min="0.5" max="6" step="0.1" value="2">
        </div>
    </div>

    <script src="cube.js"></script>
</body>
</html>
